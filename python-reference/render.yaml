services:
  - type: web
    name: cultur
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn cultur.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://api.qloo.com
      - key: ETH_RPC_URL
        value: https://ethereum-rpc.publicnode.com
      - key: DB_PATH
        value: /tmp/cultur.db
